<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Predictor</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mute:#94a3b8;--hot:#fb923c;--cold:#38bdf8;--acc:#a78bfa}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#0f172a,#1e1b4b);color:var(--ink);min-height:100vh;padding:24px 16px}
  main{max-width:760px;margin:0 auto}
  h1{font-size:2rem;margin:0 0 4px}
  .sub{color:var(--mute);margin-bottom:20px}
  form{display:flex;gap:8px;margin-bottom:20px}
  input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid #334155;background:var(--card);color:var(--ink);font-size:1rem}
  button{padding:12px 20px;border:0;border-radius:10px;background:var(--acc);color:#0f172a;font-weight:700;font-size:1rem;cursor:pointer}
  .badge{display:inline-block;font-size:.75rem;padding:3px 10px;border-radius:99px;background:#334155;color:var(--mute);margin-left:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:12px 0 24px}
  .card{background:var(--card);border-radius:14px;padding:16px}
  .card .d{color:var(--mute);font-size:.85rem}
  .hi{color:var(--hot);font-size:1.8rem;font-weight:700}
  .lo{color:var(--cold);font-size:1.2rem}
  h2{font-size:1.1rem;margin:20px 0 4px}
  svg{width:100%;height:auto;background:var(--card);border-radius:14px}
  #err{color:#f87171}
</style>
</head>
<body>
<main>
  <h1>🌦️ Weather Predictor</h1>
  <div class="sub">Type a city. Get a data-driven forecast.</div>
  <form id="f"><input id="city" value="Jammu" placeholder="City name"><button>Predict</button></form>
  <div id="err"></div>
  <div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
function chart(hist,pred){
  const pts=[...hist.map(h=>({...h,p:0})),...pred.map(h=>({...h,p:1}))];
  const W=700,H=240,pad=30;
  const all=pts.flatMap(p=>[p.max,p.min]);
  const lo=Math.min(...all)-2,hi=Math.max(...all)+2;
  const x=i=>pad+i*(W-2*pad)/(pts.length-1), y=v=>H-pad-(v-lo)/(hi-lo)*(H-2*pad);
  const line=(k,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${pts.map((p,i)=>x(i)+','+y(p[k])).join(' ')}"/>`;
  const px=x(hist.length-1);
  return `<svg viewBox="0 0 ${W} ${H}">
    <rect x="${px}" y="0" width="${W-px}" height="${H}" fill="#a78bfa" opacity=".12"/>
    ${line('max','#fb923c')}${line('min','#38bdf8')}
    <text x="${px+6}" y="18" fill="#a78bfa" font-size="12">prediction →</text>
    <text x="${pad}" y="${H-8}" fill="#94a3b8" font-size="11">${pts[0].date}</text>
    <text x="${W-pad-60}" y="${H-8}" fill="#94a3b8" font-size="11">${pts.at(-1).date}</text></svg>`;
}
const cards=a=>`<div class="grid">${a.map(d=>`<div class="card"><div class="d">${d.date}</div><div class="hi">${d.max}°</div><div class="lo">${d.min}°</div></div>`).join('')}</div>`;
async function go(e){
  e&&e.preventDefault(); $('err').textContent='';
  try{
    const r=await fetch('/api/predict?city='+encodeURIComponent($('city').value)+'&days=3');
    const j=await r.json(); if(j.error) throw new Error(j.error);
    $('out').innerHTML=`<h2>${j.city} ${j.country}<span class="badge">${j.source==='live'?'live data':'demo data'}</span></h2>
      ${chart(j.history,j.prediction)}
      <h2>Our prediction</h2>${cards(j.prediction)}
      ${j.official_forecast.length?`<h2>Official forecast (for comparison)</h2>${cards(j.official_forecast)}`:''}`;
  }catch(x){$('err').textContent=x.message}
}
$('f').onsubmit=go; go();
</script>
</body>
</html>
